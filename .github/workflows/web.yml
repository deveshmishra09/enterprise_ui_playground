name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Legacy demo code under lib/flows/** carries pre-existing lint warnings;
      # fail the build only on real errors.
      - run: flutter analyze --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release
      # Only publish on real pushes to main — PR builds still run the steps
      # above (test + build) but stop here, so a PR can't deploy to
      # production before it's merged.
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=enterprise-ui-playground --branch=main
